<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Wireframe — Track</title>
    <link rel="stylesheet" href="./wireframe.css" />
  </head>
  <body>
    <div class="wf-meta">
      <strong>Wireframe: Track `/track/`</strong>
      <a href="./index.html">All wireframes</a>
      <span>Our status + carrier number · white-label</span>
    </div>
    <div class="page">
      <header class="header">
        <div class="header-top">
          <a class="brand" href="./home.html">LiAlvaro</a>
          <a class="cta ghost" href="./account.html">Sign in</a>
        </div>
      </header>

      <section class="slot">
        <div class="label">Lookup</div>
        <h1 class="slot-title">Track your order</h1>
        <div class="form-stack">
          <div class="field">Order number</div>
          <div class="field">Email</div>
          <a class="cta primary" href="#">View status</a>
        </div>
      </section>

      <section class="slot">
        <div class="label">Status result</div>
        <div class="steps">
          <div class="step"><div class="step-num">1</div>Received</div>
          <div class="step"><div class="step-num">2</div>In production</div>
          <div class="step"><div class="step-num">3</div>Shipped / ready</div>
        </div>
        <div class="card" style="margin-top:10px">
          Carrier tracking number (link) — no vendor brand names
        </div>
      </section>
    </div>
  </body>
</html>
